<!DOCTYPE html>
<html>
<head>
    <title>Student Result System</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f9;
            text-align: center;
        }
        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        h1 {
            color: #2c3e50;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 5px;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📘 Dynamic Result System</h2>

    <form method="POST" action="/generate/">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Enter Name" required><br><br>

        <input type="text" name="standard" placeholder="Enter Standard (e.g. 10th)" required><br><br>

        <input type="number" name="num_subjects" placeholder="Number of Subjects" required><br><br>

        <button type="submit">Next</button>
    </form>
</div>

</body>
</html>
