<!DOCTYPE html>
<html>
<head>
    <title>Student Result System</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f9;
            text-align: center;
        }
        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        h1 {
            color: #2c3e50;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 5px;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Enter Marks</h2>

    <form method="POST" action="/result/">
        {% csrf_token %}

        <input type="hidden" name="name" value="{{ name }}">
        <input type="hidden" name="standard" value="{{ standard }}">
        <input type="hidden" name="num_subjects" value="{{ subjects|length }}">

        {% for i in subjects %}
            <input type="number" name="m{{ i }}" placeholder="Subject {{ i }} Marks" required><br><br>
        {% endfor %}

        <button type="submit">Generate Result</button>
    </form>
</div>

</body>
</html>
